	<body>
		<div id="app"><div class="wrap"><div class="card"><h1>Loading DeVries Learning...</h1></div></div></div>

		<script>
			window.onerror=function(m,s,l,c,e){
				var message=String((e&&e.stack)||m);
				window.__DEVriesLearningError__=message;
				var el=document.getElementById('app');
				var stillStarting=el&&/Loading DeVries Learning/i.test(el.textContent||'');
				if(stillStarting){
					el.innerHTML='<div class="wrap"><div class="card"><h1>App startup error</h1><pre>'+message+'</pre></div></div>';
				}else if(window.console&&console.error){
					console.error('DeVries Learning runtime error:',message);
				}
				return false;
			};
		</script>
